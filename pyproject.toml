[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-agent"
version = "0.1.0"
description = "An LLM agent built on a raw OpenAI tool-calling loop: vision, text-to-SQL, calculator, web search and file tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shachar Ben Zur" }, { name = "Ron Isakov" }]
dependencies = [
    "openai==1.51.0",
    "httpx==0.27.2",  # openai 1.51 breaks with httpx 0.28
    "duckduckgo-search==6.2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
